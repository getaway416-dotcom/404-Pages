
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 - Forbidden</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');

:root {
    --blue: #477eff;
    --dark: #171923;
    --gray: #858b9a;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Nunito', sans-serif;
    background: #fff;
    color: var(--dark);
    min-height: 100vh;
    overflow-x: hidden;
}

/* BACKGROUND GRADIENTS */
.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -2;
}

.gradient {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .17;
    animation: gradientMove 12s ease-in-out infinite alternate;
}

.gradient.one {
    background: #438cff;
    top: -200px;
    left: -150px;
}

.gradient.two {
    background: #a77aff;
    bottom: -200px;
    right: -100px;
    animation-delay: -5s;
}

.gradient.three {
    background: #65d9ff;
    top: 40%;
    left: 45%;
    width: 300px;
    height: 300px;
    animation-delay: -8s;
}

@keyframes gradientMove {
    from {
        transform: translate(0, 0) scale(1);
    }
    to {
        transform: translate(100px, 70px) scale(1.3);
    }
}

/* FLOATING PARTICLES */
.particles {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
}

.particles span {
    position: absolute;
    bottom: -30px;
    width: 6px;
    height: 6px;
    background: #72aaff;
    border-radius: 50%;
    opacity: 0;
    animation: floatUp linear infinite;
}

.particles span:nth-child(1) { left: 8%; animation-duration: 13s; }
.particles span:nth-child(2) { left: 20%; animation-duration: 17s; animation-delay: 2s; }
.particles span:nth-child(3) { left: 35%; animation-duration: 15s; animation-delay: 4s; }
.particles span:nth-child(4) { left: 50%; animation-duration: 19s; animation-delay: 1s; }
.particles span:nth-child(5) { left: 65%; animation-duration: 14s; animation-delay: 3s; }
.particles span:nth-child(6) { left: 80%; animation-duration: 18s; animation-delay: 5s; }
.particles span:nth-child(7) { left: 93%; animation-duration: 16s; animation-delay: 2s; }
.particles span:nth-child(8) { left: 45%; animation-duration: 20s; animation-delay: 6s; }
.particles span:nth-child(9) { left: 72%; animation-duration: 16s; animation-delay: 7s; }
.particles span:nth-child(10) { left: 12%; animation-duration: 19s; animation-delay: 8s; }

@keyframes floatUp {
    0% {
        transform: translateY(0) translateX(0) scale(.5);
        opacity: 0;
    }
    15% { opacity: .5; }
    85% { opacity: .35; }
    100% {
        transform: translateY(-110vh) translateX(40px) scale(1.5);
        opacity: 0;
    }
}

/* MAIN LAYOUT */
.container {
    min-height: 100vh;
    max-width: 1200px;
    margin: auto;
    padding: 40px 35px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 35px;
    width: 100%;
}

/* TEXT */
.text-area {
    animation: appear .9s ease both;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: #fff0f0;
    color: #e34b55;
    padding: 9px 16px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1.5px;
    margin-bottom: 25px;
}

.status-dot {
    width: 7px;
    height: 7px;
    background: #ef5963;
    border-radius: 50%;
    box-shadow: 0 0 10px #ef5963;
}

.error-code {
    font-size: clamp(100px, 15vw, 175px);
    font-weight: 900;
    line-height: .9;
    letter-spacing: -12px;
    color: var(--dark);
}

.error-code span {
    color: var(--blue);
}

h1 {
    font-size: clamp(28px, 4vw, 40px);
    margin-top: 28px;
    font-weight: 900;
    letter-spacing: -1px;
}

.description {
    color: var(--gray);
    line-height: 1.9;
    font-size: 15px;
    margin-top: 15px;
    max-width: 430px;
}

/* BUTTONS */
.buttons {
    display: flex;
    gap: 13px;
    flex-wrap: wrap;
    margin-top: 30px;
}

.btn {
    padding: 14px 23px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 800;
    transition: .3s;
}

.btn-primary {
    background: var(--blue);
    color: white;
    box-shadow: 0 8px 22px rgba(71,126,255,.2);
}

.btn-primary:hover {
    background: #2865ef;
    transform: translateY(-4px);
    box-shadow: 0 12px 25px rgba(71,126,255,.3);
}

.btn-secondary {
    background: #f2f4f8;
    color: #555d70;
}

.btn-secondary:hover {
    background: #e7ebf3;
    transform: translateY(-4px);
}

/* CHARACTER */
.illustration {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 480px;
    animation: appear 1.1s ease both;
}

.character {
    display: block;
    width: min(560px, 125%);
    max-height: 540px;
    height: auto;
    object-fit: contain;
    position: relative;
    z-index: 2;
    animation: characterFloat 4s ease-in-out infinite;
    filter: drop-shadow(0 15px 25px rgba(60,110,210,.12));
}

@keyframes characterFloat {
    0%, 100% {
        transform: translateY(0) rotate(-1deg);
    }
    50% {
        transform: translateY(-15px) rotate(1deg);
    }
}

/* CIRCLES */
.circle {
    position: absolute;
    border: 1px solid rgba(71,126,255,.2);
    border-radius: 50%;
    animation: rotate 18s linear infinite;
}

.circle.one {
    width: 340px;
    height: 340px;
}

.circle.two {
    width: 420px;
    height: 420px;
    border-style: dashed;
    animation-direction: reverse;
    animation-duration: 30s;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

/* SPARKLES */
.sparkle {
    position: absolute;
    color: #76a6ff;
    font-size: 25px;
    animation: sparkle 2.5s ease-in-out infinite;
    z-index: 3;
}

.sparkle.s1 { top: 10%; left: 12%; }
.sparkle.s2 { top: 22%; right: 8%; animation-delay: .8s; }
.sparkle.s3 { bottom: 15%; left: 10%; animation-delay: 1.3s; }
.sparkle.s4 { bottom: 20%; right: 10%; animation-delay: .5s; }

@keyframes sparkle {
    0%, 100% {
        opacity: .3;
        transform: scale(.7) rotate(0);
    }
    50% {
        opacity: 1;
        transform: scale(1.2) rotate(30deg);
    }
}

/* LOCK */
.lock {
    position: absolute;
    top: 12%;
    right: 8%;
    background: white;
    width: 60px;
    height: 60px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    font-size: 27px;
    box-shadow: 0 10px 35px rgba(50,80,140,.12);
    animation: lockFloat 3s ease-in-out infinite;
    z-index: 4;
}

@keyframes lockFloat {
    0%, 100% { transform: translateY(0) rotate(4deg); }
    50% { transform: translateY(-12px) rotate(-4deg); }
}

/* ENTRANCE */
@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* FOOTER */
footer {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    color: #a1a7b4;
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: 800;
}

/* TABLET AND MOBILE */
@media (max-width: 800px) {
    .container {
        padding: 40px 20px 30px;
    }

    .content {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 5px;
    }

    .illustration {
        order: 0;
        min-height: 350px;
    }

    .text-area {
        order: 1;
    }

    .character {
        width: min(480px, 100%);
        max-height: 380px;
    }

    .circle.one {
        width: 260px;
        height: 260px;
    }

    .circle.two {
        width: 310px;
        height: 310px;
    }

    .description {
        margin-left: auto;
        margin-right: auto;
    }

    .buttons {
        justify-content: center;
    }

    .error-code {
        letter-spacing: -7px;
    }

    footer {
        position: relative;
        margin-top: 35px;
        bottom: auto;
    }
}

/* SMALL PHONES */
@media (max-width: 420px) {
    .illustration {
        min-height: 280px;
    }

    .character {
        width: 100%;
        max-height: 300px;
    }

    .circle.one {
        width: 220px;
        height: 220px;
    }

    .circle.two {
        width: 260px;
        height: 260px;
    }

    .error-code {
        font-size: 105px;
    }

    h1 {
        font-size: 28px;
    }
}

/* ACCESSIBILITY */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<!-- ANIMATED BACKGROUND -->
<div class="background">

</div>

<!-- FLOATING PARTICLES -->
<div class="particles" aria-hidden="true">
    <span></span>

    <span></span>

<!-- MAIN CONTENT -->

</body>
</html>
