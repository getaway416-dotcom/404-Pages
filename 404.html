
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA | 404</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #080711;
      color: white;
      font-family: Arial, sans-serif;
    }

    .background {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, #54218a66, transparent 55%),
        radial-gradient(circle at 10% 20%, #173f8b66, transparent 40%),
        linear-gradient(135deg, #080711, #111027, #080711);
      animation: backgroundMove 12s infinite alternate;
    }

    @keyframes backgroundMove {
      from { filter: hue-rotate(0deg); transform: scale(1); }
      to { filter: hue-rotate(35deg); transform: scale(1.1); }
    }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 7%;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .logo span {
      display: block;
      color: #a88cff;
      font-size: 9px;
      letter-spacing: 5px;
      margin-top: 5px;
    }

    .status {
      color: #b5a5d8;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .status i {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #54ffb0;
      border-radius: 50%;
      box-shadow: 0 0 15px #54ffb0;
      margin-right: 8px;
    }

    main {
      min-height: 80vh;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 2;
    }

    .anime-gallery {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .anime-card {
      position: absolute;
      width: 220px;
      height: 350px;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid #b78cff77;
      box-shadow: 0 0 35px #864cff44;
      opacity: 0;
      animation: imageReveal 1.5s ease forwards,
                 floating 6s ease-in-out infinite 1.5s;
    }

    .anime-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 1s ease, filter 1s ease;
    }

    .anime-card:hover img {
      transform: scale(1.15);
      filter: brightness(1.2);
    }

    .card1 {
      left: 5%;
      top: 10%;
      transform: rotate(-9deg);
      animation-delay: 0s, 1.5s;
    }

    .card2 {
      right: 7%;
      top: 8%;
      transform: rotate(9deg);
      animation-delay: .3s, 1.8s;
    }

    .card3 {
      left: 13%;
      bottom: -15%;
      transform: rotate(8deg);
      animation-delay: .6s, 2.1s;
    }

    .card4 {
      right: 12%;
      bottom: -15%;
      transform: rotate(-8deg);
      animation-delay: .9s, 2.4s;
    }

    @keyframes imageReveal {
      from { opacity: 0; filter: blur(15px); }
      to { opacity: .65; filter: blur(0); }
    }

    @keyframes floating {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -22px; }
    }

    .content {
      text-align: center;
      position: relative;
      z-index: 5;
      padding: 35px;
      animation: appear 1.2s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tag {
      color: #c4a8ff;
      font-size: 11px;
      letter-spacing: 6px;
    }

    h1 {
      font-size: clamp(110px, 20vw, 220px);
      line-height: 1;
      font-weight: 900;
      background: linear-gradient(135deg, #fff, #b18cff, #6f8cff);
      -webkit-background-clip: text;
      color: transparent;
      animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 10px #875aff55); }
      to { filter: drop-shadow(0 0 35px #875affaa); }
    }

    h2 {
      font-size: clamp(18px, 3vw, 30px);
      letter-spacing: 5px;
      margin-bottom: 18px;
    }

    p {
      color: #aaa5bd;
      font-size: 14px;
    }

    .line {
      width: 150px;
      height: 2px;
      margin: 30px auto;
      background: linear-gradient(90deg, transparent, #a78bfa, transparent);
    }

    .footer-text {
      font-size: 9px;
      letter-spacing: 3px;
      color: #817c9a;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #c5a4ff;
      border-radius: 50%;
      box-shadow: 0 0 12px #b78cff;
      animation: rise linear infinite;
    }

    @keyframes rise {
      from { transform: translateY(100vh); opacity: 0; }
      20% { opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }

    @media(max-width: 700px) {
      header { padding: 22px; }

      .anime-card {
        width: 125px;
        height: 210px;
        opacity: .35;
      }

      .card1 { left: -35px; }
      .card2 { right: -35px; }
      .card3, .card4 { display: none; }

      .content { padding: 15px; }
      h2 { letter-spacing: 2px; }
      .tag { letter-spacing: 3px; }
    }

    @media(prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>

  <div class="background"></div>
  <div class="particles" id="particles"></div>

  <header>
    <div class="logo">NEXORA<span>Website</span></div>
    <div class="status"><i></i> SYSTEM ONLINE</div>
  </header>

  <main>
    <div class="anime-gallery">

      <div class="anime-card card1">
        <img
          src="https://i.pinimg.com/564x/24/0b/45/240b450586e7fbb7df51a628276e6b1f.jpg"
          alt="Naruto anime artwork"
          loading="eager"
        >
      </div>

      <div class="anime-card card2">
        <img
          src="https://i.pinimg.com/736x/d8/94/40/d894409f3c0428096a8c338907b53c3f.jpg"
          alt="Gojo anime artwork"
          loading="eager"
        >
      </div>

      <div class="anime-card card3">
        <img
          src="https://i.redd.it/sgaem70jbteh1.jpeg"
          alt="Hunter x Hunter artwork"
          loading="eager"
        >
      </div>

      <div class="anime-card card4">
        <img
          src="https://i.pinimg.com/736x/58/27/67/58276760ec13f352fc8f77a9f2c2da3f.jpg"
          alt="Demon Slayer artwork"
          loading="eager"
        >
      </div>

    </div>

    <section class="content">
      <div class="tag">NEXORA DIGITAL UNIVERSE</div>
      <h1>404</h1>
      <h2>LOST IN ANOTHER WORLD</h2>
      <p>The page you're looking for doesn't exist.</p>
      <div class="line"></div>
      <div class="footer-text">
        NEXORA BOT HOST · ALL SYSTEMS OPERATIONAL
      </div>
    </section>
  </main>

  <script>
    const particleContainer = document.getElementById("particles");

    for (let i = 0; i < 55; i++) {
      const particle = document.createElement("div");

      particle.className = "particle";
      particle.style.left = Math.random() * 100 + "%";
      particle.style.animationDuration = 5 + Math.random() * 12 + "s";
      particle.style.animationDelay = Math.random() * 10 + "s";

      particleContainer.appendChild(particle);
    }

    const gallery = document.querySelector(".anime-gallery");

    document.addEventListener("mousemove", (event) => {
      const x = (event.clientX / window.innerWidth - 0.5) * 20;
      const y = (event.clientY / window.innerHeight - 0.5) * 20;

      gallery.style.transform = `translate(${x}px, ${y}px)`;
    });
  </script>
</body>
</html>
